# Wind calendar configuration. Copy to config.yml and adjust.

# Timezone used for times shown in event descriptions.
timezone: Europe/Amsterdam

# How often to fetch new forecasts.
fetchIntervalMinutes: 60

# Only create events up to this many days ahead (1-15).
maxDaysAhead: 7

# Extra days after maxDaysAhead with uncertain 🔮 events: a single model meeting the conditions
# is enough there. maxDaysAhead + outlookDays can be at most 15; 0 turns the outlook off.
outlookDays: 4

# Global "good condition" settings. Every spot can override any of these.
conditions:
  minWindKn: 16 # every hour in a window needs at least this much wind
  maxWindKn: null # optional upper limit, null = no limit
  minDurationHours: 2 # minimum consecutive good hours
  minTempC: 5
  peakToleranceKn: 3 # hours less than this far below the peak belong to the peak block
  directionSpreadDeg: 25 # warn when models deviate this much (weighted average, degrees) from the blended direction
  windSpreadKn: 4 # warn when models deviate this much (weighted average, knots) from the blended wind

# Forecast models, blended by weight for every hour (see "Models" in the README).
# Every model with data takes part, so when a high-resolution model's horizon ends the others
# carry on. Give each model a resolutionKm (its grid spacing, from the Open-Meteo docs) and its
# weight becomes (10 / resolutionKm)², so a model with half the grid spacing counts 4x as much.
# An explicit weight overrides that.
# latestRuns: true also reads the model's newest runs from Open-Meteo's Single Runs API (see
# "Newest model runs" in the README). So far only known to help icon_eu and icon_global.
models:
  # High-resolution regional models that cover your spots, e.g.
  # - { id: <regional model id>, name: <short name>, resolutionKm: 2 }
  #
  # Global models, available everywhere:
  - { id: ecmwf_ifs, name: ECMWF, resolutionKm: 9 } # ECMWF IFS, 15 days
  - { id: icon_global, name: ICON, resolutionKm: 13 } # ICON global, ~7.5 days; consider latestRuns: true
  - { id: gfs_global, name: GFS, resolutionKm: 13 } # GFS 0.11°, 16 days

spots:
  - name: Scheveningen
    lat: 52.11
    lon: 4.27
    weight: 10 # higher weight wins when spots are good at the same time
    directions: [SW, WSW, W, WNW, NW]
    conditions: # optional overrides
      minWindKn: 18

  - name: Brouwersdam
    lat: 51.76
    lon: 3.85
    weight: 5
    directions: [SW, WSW, W, WNW, NW, NNW, N]
    # Optional: this spot's own models, replacing the global models entirely.
    # models:
    #   - { id: <regional model id>, name: <short name>, resolutionKm: 2 }
    #   - { id: ecmwf_ifs, name: ECMWF, resolutionKm: 9 }
